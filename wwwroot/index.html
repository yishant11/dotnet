<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow | C# & ASP.NET Core</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaeafb;background:#0e1120}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#30335b 0,transparent 37%),#0e1120}main{width:min(650px,calc(100% - 32px));margin:70px auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.brand{font-size:15px;font-weight:750;color:#a99bff;letter-spacing:.07em}.pill{font-size:12px;border:1px solid #454664;color:#b4b4ce;padding:8px 12px;border-radius:30px}h1{font-size:clamp(36px,6vw,54px);letter-spacing:-.05em;margin:0 0 10px}p{color:#a6a8c2;margin:0 0 28px}.panel{background:#1a1d33;border:1px solid #333653;border-radius:20px;padding:25px;box-shadow:0 28px 90px #0004}form{display:flex;gap:10px}input{min-width:0;flex:1;background:#111429;border:1px solid #3c3e5d;color:white;border-radius:11px;padding:13px;font:inherit;outline:none}input:focus{border-color:#9a8cff}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:12px 16px;font-weight:650;background:#9989fa;color:#101226}button:hover{filter:brightness(1.08)}.meta{display:flex;justify-content:space-between;font-size:13px;color:#b4b4cf;border-bottom:1px solid #383a53;padding:25px 0 13px}ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:center;gap:12px;border-bottom:1px solid #30334a;padding:15px 0}li:last-child{border:0}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#8587a1}li input{flex:0 0 auto;width:18px;height:18px;accent-color:#9989fa}li button{background:#2c2d48;color:#d5d5e9;font-size:12px;padding:9px}.empty{text-align:center;color:#9295b5;padding:45px 0}.error{color:#ffaaaa;min-height:22px;margin-top:12px;font-size:13px}footer{margin-top:24px;color:#7c7f9c;text-align:center;font-size:12px}
  </style>
</head>
<body><main><header><div class="brand">✦ TASKFLOW</div><div class="pill">ASP.NET Core · .NET 10</div></header><h1>Get things done.</h1><p>A clean task manager powered by C# REST APIs.</p><section class="panel"><form id="form"><input id="title" maxlength="100" placeholder="What do you need to do?" aria-label="New task" required /><button type="submit">+ Add task</button></form><div class="error" id="error" role="alert"></div><div class="meta"><span id="count">Tasks</span><span>YOUR WORKSPACE</span></div><ul id="tasks"></ul></section><footer>Built with C# · ASP.NET Core Minimal API · Vanilla JS</footer></main>
<script>
const list=document.getElementById('tasks'),error=document.getElementById('error'),count=document.getElementById('count'),input=document.getElementById('title');let tasks=[];
async function request(url, options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok){let data={};try{data=await response.json()}catch{}throw new Error(data.error||`Request failed (${response.status})`)}return response.status===204?null:response.json()}
function showError(e){error.textContent=e?.message||'Something went wrong. Please retry.'}
function render(){list.replaceChildren();count.textContent=`${tasks.filter(t=>!t.isCompleted).length} active · ${tasks.length} total`;if(!tasks.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No tasks yet. Add your first one ✨';list.append(empty);return}for(const task of tasks){const li=document.createElement('li');if(task.isCompleted)li.className='done';const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=task.isCompleted;toggle.setAttribute('aria-label',`Complete ${task.title}`);toggle.addEventListener('change',async()=>{toggle.disabled=true;try{await request(`/api/tasks/${task.id}`,{method:'PUT',body:JSON.stringify({title:task.title,isCompleted:toggle.checked})});await load()}catch(e){showError(e);toggle.disabled=false;toggle.checked=!toggle.checked}});const label=document.createElement('span');label.textContent=task.title;const del=document.createElement('button');del.textContent='Delete';del.setAttribute('aria-label',`Delete ${task.title}`);del.onclick=async()=>{del.disabled=true;try{await request(`/api/tasks/${task.id}`,{method:'DELETE'});await load()}catch(e){showError(e);del.disabled=false}};li.append(toggle,label,del);list.append(li)}}
async function load(){tasks=await request('/api/tasks');render()}
document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();error.textContent='';const title=input.value.trim();if(!title)return;const btn=e.target.querySelector('button');btn.disabled=true;try{await request('/api/tasks',{method:'POST',body:JSON.stringify({title})});input.value='';await load()}catch(e){showError(e)}finally{btn.disabled=false}});
load().catch(showError);
</script></body></html>
